<!DOCTYPE html>
<html lang="en">
<head>
    <title>NUVA editor</title>
    <link href = "style/styles.css" rel="stylesheet">
    <script type = 'text/javascript' src='scripts/common.js'></script>
    <script type = 'text/javascript' src='scripts/nuvafiles.js'></script>
    <script type = 'text/javascript' src='scripts/extcode.js'></script>
	
</head>
<body>
<nav class="sidebar">
  <h1>NUVA</h1>
  <ul>
    <li><a href="index.html">Usage</a></li>
    <li><a href="vaccines.html">Vaccines</a></li>
    <li><a href="valences.html">Valences</a></li>
    <li><a href="files.html">Files</a></li>	
    <li><a href="extcodes.html">Code Systems</a></li>		
  </ul>
 <h3>Filter</h3>
 <input id='filterText' type = "text" style="margin:6px" oninput="showCodes()">  
<h3>Current vaccine</h3>
<div id='idvac'></div> 
<h3>Current code</h3>
<div id='idcode'></div> 
<div class='version'>
  <div><span>Version:</span><span id='curVer'></span></div>
  <div><span>Default:</span><span id='defVer'></span></div>
  </div>
</nav>

<main class="content">
<h1>Code systems</h1>
<div>
  <button onclick="selectCSV()">Import from CSV</button>
  <button onclick="saveCodeSystem()">Save to CSV</button>
  <button onclick="clearCodeSystem()">Clear</button>
  <button onclick="reverseCodeSystem()">Create reverse map</button>
  <button id = "transcription" disabled onclick="selectCSV2()">Create transcription map</button>
</div>
<div style = "height:20px; margin-bottom:5px">  
  <input id="alignment" type='file' accept='.csv' style = "display:none" onchange='uploadCSV()'></input>
  <input id="alignment2" type='file' accept='.csv' style = "display:none" onchange='uploadCSV2()'></input>
 </div>
<div style = "overflow:scroll; height:80vh">
<table>
<thead><th>Code</th><th>Code label</th><th>NUVA</th><th>NUVA label</th></thead>
<tbody id = 'tcodes'>
</tbody>
</table>
</div>
</main>

<div id = "edit" class = "edit">
<span id='extcode' ></span>
<span>
	<select id = 'actionSelect' onchange="setNuvaCode()">
	<option value = 'pending' selected>Choose action ...</option>
	<option value='set'>Map to current vaccine</option>
	<option value='NA'>Out of scope</option>
	<option value = 'MISSING'>Vaccine concept missing</option>
	<option value = 'reset'>Reset to initial value</option>
	</select>
</span>
<span id= 'ecode'></span>
<span id='action'></span>
</div>


<div id='alertbox' class="alert" onclick = ackAlert()>
<p id='alertmsg' valign='center' align='center'>Mon message</p>
</div>

<script type = "text/javascript">

window.onload = function () {
  document.page = "ExtCodes"
  initContext()
  CSData = loadFromSession("CSData", voidCSData)
}
</script>

</body>
</html>
