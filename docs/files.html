<!DOCTYPE html>
<html lang="en">
<head>
    <title>NUVA editor</title>
    <link href = "style/styles.css" rel="stylesheet">
    <script type = 'text/javascript' src='https://nuva.ivci.org/scripts/vaccines.js'></script>
    <script type = 'text/javascript' src='https://nuva.ivci.org/scripts/valences.js'></script>	
    <script type = 'text/javascript' src='scripts/nuva.js'></script>
    <script type = 'text/javascript' src='scripts/nuvafiles.js'></script>
</head>
<body>
<nav class="sidebar">
  <h1>NUVA</h1>
  <ul>
    <li><a href="index.html">Usage</a></li>
    <li><a href="vaccines.html">Vaccines</a></li>
    <li><a href="valences.html">Valences</a></li>
    <li><a href="files.html">Files</a></li>		
  </ul>

</nav>

<main class="content">
<h2>Work files</h2>
<div class = "box">
<p>Upload or download the current work status.</p>
<p>All current changes can be deleted with "Reset to default".</p>
<button onclick="saveBackup()">Save</button>
<button onclick="selectFile()">Restore</button>
<input id="backup" type='file' accept='.json' style = "display:none" onchange='restoreBackup()'></input>

<button style = "color:white; background-color:red; float:right" onclick="reset()">Reset to default</button>
</div>
<h2>Unit files</h2>
<div class = "box">
<p>Check and build the Unit files for submission.</p>
<button onclick="CheckAll()">Check only</button>
<button onclick="Unitsdl()">Download</button>
</div>
<h2>Execution log</h2>
<div id = "log" class="scrollbox">
</div>

</main>

<div id='alertbox' class="alert" onclick = ackAlert()>
<p id='alertmsg' valign='center' align='center'>Mon message</p>
</div>

<script type = "text/javascript">

window.onload = function () {
  initContext()
  initLog()
}
</script>

</body>
</html>
